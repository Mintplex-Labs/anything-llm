# Weaviate servers for weaviate.integration.test.js. See run-integration.sh.
#   WEAVIATE_VERSION=1.32.27 docker compose -f docker-compose.yml up -d
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:${WEAVIATE_VERSION:-1.39.7}
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "${WEAVIATE_HTTP_PORT:-18080}:8080"
      - "${WEAVIATE_GRPC_PORT:-15051}:50051"
      - "${WEAVIATE_DEBUG_PORT:-16060}:6060"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"

  weaviate-auth:
    image: cr.weaviate.io/semitechnologies/weaviate:${WEAVIATE_VERSION:-1.39.7}
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "${WEAVIATE_AUTH_HTTP_PORT:-18081}:8080"
      - "${WEAVIATE_AUTH_GRPC_PORT:-15052}:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: anythingllm-test-key
      AUTHENTICATION_APIKEY_USERS: anythingllm
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      DISABLE_TELEMETRY: "true"
