name: anythingllm

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm:
    container_name: anythingllm
    # Bring the container back if the server or collector dies, or after a Docker/host restart
    restart: unless-stopped
    # Run a real init as PID 1 so orphaned MCP server processes get reaped
    init: true
    # Check more often than the image default so a hung server or collector is flagged unhealthy
    # within about a minute. A hung collector is then restarted by the entrypoint's watchdog.
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
