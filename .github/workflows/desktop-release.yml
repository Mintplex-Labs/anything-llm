name: Publish SWARMSY Desktop Release

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example desktop-v1.13.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: true
        type: boolean
      draft:
        description: "Create or update the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  publish-windows-desktop-release:
    name: Build and publish Windows desktop release
    runs-on: windows-latest
    timeout-minutes: 75

    env:
      ELECTRON_VERSION: 33.4.11
      PUPPETEER_SKIP_DOWNLOAD: "true"
      SHARP_IGNORE_GLOBAL_LIBVIPS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag could not be resolved. Use workflow_dispatch with tag_name or push a desktop-v* tag."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install root dependencies when lockfile exists
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
            git diff --quiet -- package-lock.json
            if ($LASTEXITCODE -ne 0) {
              git diff -- package-lock.json
              throw "package-lock.json changed during npm ci. Please commit lockfile updates."
            }
          } elseif (Test-Path npm-shrinkwrap.json) {
            npm ci
            git diff --quiet -- npm-shrinkwrap.json
            if ($LASTEXITCODE -ne 0) {
              git diff -- npm-shrinkwrap.json
              throw "npm-shrinkwrap.json changed during npm ci. Please commit lockfile updates."
            }
          } else {
            Write-Host "No root npm lockfile found; skipping root npm ci. Desktop packaging scripts use Node built-ins."
          }
          git status --short
          git diff --name-only

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: yarn install --frozen-lockfile

      - name: Install collector dependencies
        working-directory: collector
        run: yarn install --frozen-lockfile

      - name: Validate yarn lockfiles
        shell: pwsh
        run: |
          $required = @(
            "frontend/yarn.lock",
            "server/yarn.lock",
            "collector/yarn.lock"
          )
          foreach ($lockfile in $required) {
            if (!(Test-Path $lockfile)) {
              throw "Missing required lockfile: $lockfile"
            }
          }
          git diff --quiet -- frontend/yarn.lock server/yarn.lock collector/yarn.lock
          if ($LASTEXITCODE -ne 0) {
            git diff -- frontend/yarn.lock server/yarn.lock collector/yarn.lock
            throw "yarn.lock files changed during install/build steps. Please commit lockfile updates."
          }

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Validate desktop foundation
        run: npm run desktop:smoke

      - name: Run desktop wrapper tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/desktopWrapperFoundation.test.js --runInBand

      - name: Run desktop runtime launcher tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/runtimeLauncher.test.js server/__tests__/desktop/runtimeHealthcheck.test.js --runInBand

      - name: Run desktop backup tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/localBackupStore.test.js --runInBand

      - name: Run desktop diagnostics tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/desktopDiagnosticsIntegration.test.js --runInBand

      - name: Run desktop installer packaging tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/desktopInstallerPackaging.test.js --runInBand

      - name: Run desktop signing and release integrity tests
        run: npx --yes jest@29.7.0 server/__tests__/desktop/desktopSigningFoundation.test.js server/__tests__/desktop/desktopReleaseIntegrity.test.js --runInBand

      - name: Download and verify Electron runtime
        shell: pwsh
        run: |
          $zipName = "electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          $shasumsPath = Join-Path $env:RUNNER_TEMP "electron-v$env:ELECTRON_VERSION-SHASUMS256.txt"
          $extractPath = Join-Path $env:RUNNER_TEMP "electron-win32-x64"
          $releaseUrl = "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION"
          Invoke-WebRequest -Uri "$releaseUrl/$zipName" -OutFile $zipPath
          Invoke-WebRequest -Uri "$releaseUrl/SHASUMS256.txt" -OutFile $shasumsPath

          $matchingLine = Get-Content $shasumsPath | Where-Object {
            $parts = $_ -split "\s+", 2
            $parts.Length -eq 2 -and $parts[1].TrimStart("*") -eq $zipName
          } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($matchingLine)) {
            throw "Electron SHASUMS256.txt does not contain $zipName"
          }

          $expectedSha256 = ($matchingLine -split "\s+", 2)[0].ToLowerInvariant()
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Electron runtime SHA256 mismatch for $zipName. Expected $expectedSha256 but got $actualSha256."
          }

          if (Test-Path $extractPath) { Remove-Item -Recurse -Force $extractPath }
          Expand-Archive -Path $zipPath -DestinationPath $extractPath
          "ELECTRON_DIST_PATH=$extractPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package desktop app artifact
        run: npm run desktop:artifact:package:win

      - name: Smoke validate desktop app artifact
        run: npm run desktop:artifact:smoke

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows installer
        run: npm run desktop:installer:package:win

      - name: Generate SHA256 checksums and release integrity manifest
        run: npm run desktop:release:manifest

      - name: Validate release integrity manifest and checksums
        run: npm run desktop:release:validate

      - name: Smoke validate Windows installer
        run: npm run desktop:installer:smoke

      - name: Write release notes
        shell: pwsh
        run: |
          @"
          # SWARMSY Desktop for Windows

          ## Recommended download
          Download `SWARMSY-Desktop-Setup.exe`, then double-click the installer and open SWARMSY Desktop.

          ## Tester download
          `swarmsy-desktop-win32-x64.zip` is also available as a portable build for testers.

          ## Notes
          - Normal users do not need CMD, Node, yarn, Electron setup, or local build steps.
          - Ollama is required for local AI. Ollama and models are not bundled.
          - The hosted web app remains available at https://swarmsy.cryptomoonboys.com
          - This build is unsigned for now, so Windows SmartScreen may warn before installation.
          - Uninstalling SWARMSY Desktop removes app files only and does not wipe user data.
          - `SHA256SUMS.txt` contains checksums for the installer and portable zip.
          "@ | Set-Content -Path desktop/artifacts/RELEASE_NOTES.md -Encoding UTF8

      - name: Upload permanent GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_TITLE: SWARMSY Desktop ${{ steps.release_tag.outputs.tag }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' && 'true' || 'false' }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' && 'true' || 'false' }}
        run: |
          $assets = @(
            "desktop/artifacts/SWARMSY-Desktop-Setup.exe",
            "desktop/artifacts/swarmsy-desktop-win32-x64.zip",
            "desktop/artifacts/SHA256SUMS.txt",
            "desktop/artifacts/SWARMSY-Desktop-Release.json",
            "desktop/artifacts/SWARMSY-Desktop-Setup.manifest.json"
          )
          foreach ($asset in $assets) {
            if (!(Test-Path $asset)) { throw "Missing release asset: $asset" }
          }

          $releaseArgs = @(
            $env:RELEASE_TAG,
            "--title", $env:RELEASE_TITLE,
            "--notes-file", "desktop/artifacts/RELEASE_NOTES.md",
            "--target", "${{ github.sha }}"
          )
          $editReleaseArgs = $releaseArgs + @(
            "--draft=$env:RELEASE_DRAFT",
            "--prerelease=$env:RELEASE_PRERELEASE"
          )
          $createReleaseArgs = $releaseArgs
          if ($env:RELEASE_DRAFT -eq "true") { $createReleaseArgs += "--draft" }
          if ($env:RELEASE_PRERELEASE -eq "true") { $createReleaseArgs += "--prerelease" }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit @editReleaseArgs
          } else {
            gh release create @createReleaseArgs
          }
          gh release upload $env:RELEASE_TAG @assets --clobber

      - name: Upload build log artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: SWARMSY-Desktop-Release-${{ steps.release_tag.outputs.tag }}
          path: |
            desktop/artifacts/SWARMSY-Desktop-Setup.exe
            desktop/artifacts/swarmsy-desktop-win32-x64.zip
            desktop/artifacts/SHA256SUMS.txt
            desktop/artifacts/SWARMSY-Desktop-Release.json
            desktop/artifacts/SWARMSY-Desktop-Setup.manifest.json
            desktop/artifacts/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
